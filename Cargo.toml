[package]
name = "unicode-identity-workbench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[lib]
name = "uiw"
path = "src/lib.rs"

[dependencies]
unicode-normalization = "0.1.25"
unicode-general-category = "1.1.0"
unicode-script = "0.5.8"
caseless = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
